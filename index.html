<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12051c">
<title>Desafío GPD2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Yellowtail&display=swap">
<style>
/* Tema "Sunset Coast" v2: cielo nocturno violeta, atardecer rosa-naranja-dorado, neón turquesa.
   Paneles casi opacos para contraste; títulos condensados; tamaños pensados para proyector y celular. */
:root{
  color-scheme:dark;
  --night:#12051c; --panel:#200a33; --panel-2:#2e1046; --panel-3:#3b1658; --line:#5a2a73; --line-2:#7a3a8f;
  --ink:#fff6fa; --soft:#f0dcf7; --muted:#cdb0de; --pink:#ff3c8e; --orange:#ff8a3d; --gold:#ffd166; --teal:#1de9d4; --bad:#ff5a75;
  --accent:var(--gold); --ok:var(--teal);
  --sunset:linear-gradient(100deg,#ff3c8e 0%,#ff8a3d 55%,#ffd166 100%);
  --f-display:"Anton","Barlow Condensed",Impact,system-ui,sans-serif;
  --f-script:"Yellowtail","Brush Script MT",cursive;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
html,body{margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;min-height:100vh;
  background:radial-gradient(130% 60% at 50% 110%, rgba(255,138,61,.30) 0%, rgba(255,60,142,.22) 40%, rgba(18,5,28,0) 75%),
             linear-gradient(180deg,#12051c 0%,#1c0830 60%,#2a0c3d 100%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;left:50%;bottom:-40vmin;width:64vmin;height:64vmin;transform:translateX(-50%);border-radius:50%;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,#ffd166 0%,#ff8a3d 45%,#ff3c8e 100%);opacity:.10;
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px);mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px)}
#app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
/* encabezado */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid transparent;border-image:var(--sunset) 1}
.brand{font-family:var(--f-script);font-size:32px;line-height:1.1;color:var(--pink);display:flex;align-items:baseline;gap:8px;padding-top:2px}
.brand span{font-family:var(--f-display);font-size:32px;letter-spacing:.04em;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--teal);text-transform:uppercase;letter-spacing:.12em;border:1px solid rgba(29,233,212,.4);border-radius:999px;padding:4px 14px}
/* tipografía */
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:clamp(36px,5.4vw,64px);line-height:1.12;padding-top:.06em;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.12;padding-top:.04em;color:var(--ink)}
h3{font-family:var(--f-cond);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.lead{font-size:clamp(18px,1.8vw,22px);color:var(--soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:0 14px 40px rgba(5,0,12,.5)}
.center{text-align:center;align-items:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.end{justify-content:flex-end}
/* botones */
.btn{font-family:var(--f-cond);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.08em;border-radius:12px;padding:13px 24px;border:1.5px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--pink)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.teampick:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.primary{background:var(--sunset);border:none;color:#2a0626;box-shadow:0 8px 26px rgba(255,60,142,.40)}
.btn.primary:hover{box-shadow:0 10px 32px rgba(255,138,61,.55)}
.btn.big{font-size:22px;padding:16px 32px}
.btn.small{font-size:14px;padding:8px 14px;border-radius:9px}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
/* formularios */
label{font-family:var(--f-cond);font-weight:700;font-size:16px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:8px}
label.check{flex-direction:row;align-items:center;gap:12px;color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:500;font-size:17px}
input,select{font:inherit;font-family:var(--f-body);font-size:18px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);background:#170624;border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;min-width:0}
input::placeholder{color:#a585b8}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
.grid-setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.teamrow{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1.5px solid var(--line-2);background:#170624}
.teamrow .swatch{width:10px;height:auto;border-radius:0;flex:none}
.teamrow input{flex:1;border:none;border-radius:0;background:transparent}
.swatch{width:14px;height:14px;border-radius:50%;flex:none}
.rules{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-cond);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.rules span{border-radius:999px;padding:4px 12px;background:var(--panel-2);border:1px solid var(--line)}
.rules .p{color:var(--teal)} .rules .n{color:var(--bad)} .rules .z{color:var(--soft)}
/* pregunta */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:16px}
.qhead-l{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.qnum{font-family:var(--f-display);font-size:24px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);line-height:1.1}
.qnum small{font-size:.75em;color:var(--muted)}
.topic{font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--teal);text-transform:uppercase;letter-spacing:.1em;border:1px solid rgba(29,233,212,.5);border-radius:999px;padding:3px 12px}
.qtext{font-family:var(--f-cond);font-weight:700;font-size:clamp(26px,3.6vw,46px);line-height:1.15;text-wrap:pretty}
.ring{--p:1;--rc:var(--gold);flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p)*360deg), rgba(255,255,255,.12) 0);transition:--p .25s linear}
.ring::before{content:"";grid-area:1/1;width:78px;height:78px;border-radius:50%;background:var(--panel)}
.ring span{grid-area:1/1;position:relative;font-family:var(--f-display);font-size:40px;line-height:1;color:var(--rc);font-variant-numeric:tabular-nums}
.ring.low{--rc:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;font:inherit;font-family:var(--f-body);font-size:clamp(18px,1.9vw,23px);font-weight:600;line-height:1.3;color:var(--ink);
  background:var(--panel-2);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;min-height:92px;transition:border-color .12s,box-shadow .12s,transform .12s,opacity .2s}
.opt .l{font-family:var(--f-display);font-size:28px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#24051f;background:var(--lc,var(--gold))}
.opts > :nth-child(1){--lc:#ff4f9a} .opts > :nth-child(2){--lc:#1de9d4} .opts > :nth-child(3){--lc:#ffd166} .opts > :nth-child(4){--lc:#b088ff}
.opt .cnt{font-family:var(--f-cond);font-weight:700;font-size:18px;white-space:nowrap;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.1);color:var(--soft)}
button.opt:hover:not(:disabled){border-color:var(--lc);box-shadow:0 0 0 1px var(--lc) inset;transform:translateY(-1px)}
.opt.sel{border-color:var(--gold);background:#4a2a3c;box-shadow:0 0 0 2px var(--gold) inset}
.opt.right{border-color:var(--teal);background:#0f4a52;box-shadow:0 0 0 2px var(--teal) inset,0 0 28px rgba(29,233,212,.35)}
.opt.right .l{background:var(--teal)}
.opt.right .cnt{background:var(--teal);color:#03302c}
.opt.wrong{border-color:var(--bad);background:#4a1630}
.opt.wrong .cnt{background:rgba(255,90,117,.25);color:#ffd0d8}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.opt:disabled:not(.sel){opacity:.6}
.expl{border-left:5px solid var(--teal);background:rgba(29,233,212,.08);border-radius:0 12px 12px 0;padding:12px 16px;font-size:clamp(17px,1.7vw,21px);color:var(--soft)}
/* progreso de respuestas (docente) */
.progress{display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px}
.progress .lbl{font-family:var(--f-cond);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.progress .lbl b{color:var(--gold);font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.02em}
.meter{height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sunset);border-radius:6px;transition:width .3s}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.team{background:var(--panel-2);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.team.empty{opacity:.55}
.team .name{font-family:var(--f-cond);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15;overflow-wrap:anywhere}
.team .st{font-size:15px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.team .big2{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.team .big2 small{font-size:.55em;color:var(--muted)}
.team .meter{height:8px}
.team .meter i{background:var(--c)}
/* marcador */
.board{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:44px minmax(160px,260px) minmax(0,1fr) 110px;gap:14px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.brow.first{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pos{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--muted);text-align:center}
.brow.first .pos{color:var(--gold)}
.bname{display:flex;flex-direction:column;min-width:0}
.bname b{display:flex;align-items:center;gap:10px;font-family:var(--f-cond);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname b .swatch{width:14px;height:14px}
.bname small{font-size:15px;color:var(--muted);padding-left:24px}
.btrack{height:16px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.btrack i{display:block;height:100%;border-radius:8px;transition:width .6s ease}
.pts{font-family:var(--f-display);font-size:32px;line-height:1;text-align:right;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
.delta{font-family:var(--f-cond);font-weight:700;font-size:17px;border-radius:999px;padding:2px 8px}
.delta.p{color:#03302c;background:var(--teal)} .delta.n{color:#3a0612;background:var(--bad)} .delta.z{color:var(--muted);background:rgba(255,255,255,.08)}
/* sala de espera */
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.qr{background:#fff;border-radius:18px;padding:12px;width:min(320px,72vw);box-shadow:0 0 0 5px var(--pink),0 0 40px rgba(255,60,142,.45)}
.qr svg{display:block;width:100%;height:auto}
.joininfo{display:flex;flex-direction:column;gap:14px;min-width:0}
.joinurl{font-family:var(--f-cond);font-weight:700;font-size:clamp(22px,2.6vw,32px);color:var(--gold);overflow-wrap:anywhere;line-height:1.2}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:clamp(17px,1.7vw,21px);color:var(--soft)}
/* alumno */
.me{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:12px 16px}
.me .who{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.me .who b{font-family:var(--f-cond);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .score{text-align:right;line-height:1}
.me .score b{font-family:var(--f-display);font-size:30px;font-weight:400}
.me .score span{display:block;font-family:var(--f-cond);font-weight:700;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.teampicks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.teampick{font-family:var(--f-cond);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;color:#22051f;border:3px solid transparent;border-radius:14px;padding:18px 12px;cursor:pointer;overflow-wrap:anywhere;min-height:72px;transition:transform .12s,box-shadow .12s}
.teampick:hover{transform:translateY(-2px)}
.teampick.on{border-color:#fff;box-shadow:0 0 0 3px var(--night) inset,0 0 0 2px #fff}
.result{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:64px;line-height:1;color:#12051c;background:var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 55%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:28px;border-radius:999px;padding:6px 18px;background:var(--rc);color:#12051c;line-height:1.1}
.answer{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;text-align:left;width:100%;background:#0f4a52;border:2px solid var(--teal);border-radius:14px;padding:12px 14px;font-weight:600;font-size:19px}
.answer .l{font-family:var(--f-display);font-size:24px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#03302c;background:var(--teal)}
.teamline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-family:var(--f-cond);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.teamline span{border-radius:999px;padding:4px 12px;background:var(--panel-2);border:1px solid var(--line)}
.big{font-family:var(--f-display);font-size:clamp(72px,18vw,128px);line-height:1.05;padding-top:.05em}
.note{font-size:16px;color:var(--muted)}
.sent{font-family:var(--f-cond);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);text-align:center}
.err{color:var(--bad);font-weight:700}
/* final */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:140px}
.pod .blk{width:140px;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:12px;font-family:var(--f-display);font-size:44px;color:#22051f}
.pod .nm{font-family:var(--f-cond);font-weight:700;font-size:22px;text-transform:uppercase;text-align:center;overflow-wrap:anywhere;max-width:170px;line-height:1.15}
.pod .pp{font-family:var(--f-display);font-size:24px;color:var(--soft)}
.stars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.star{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:10px 14px;border-left:6px solid var(--c);font-size:18px}
.star b{overflow-wrap:anywhere;font-weight:600}
.star span{font-family:var(--f-cond);font-weight:700;font-size:19px;color:var(--gold);white-space:nowrap}
@media (max-width:760px){
  body{font-size:17px}
  .card{padding:18px;border-radius:16px;gap:14px}
  .lobby{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .brow{grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"pos name pts" ". track track";row-gap:8px;padding:10px 12px}
  .brow .pos{grid-area:pos;font-size:24px} .brow .bname{grid-area:name} .brow .btrack{grid-area:track;height:10px} .brow .pts{grid-area:pts;font-size:26px}
  .bname b{font-size:18px} .bname small{font-size:14px}
}
@media (max-width:640px){
  .top{padding-bottom:10px}
  .brand,.brand span{font-size:26px}
  .tag{font-size:12px;padding:3px 10px}
  .opts{grid-template-columns:minmax(0,1fr);gap:10px}
  .opt{grid-template-columns:46px minmax(0,1fr) auto;gap:12px;min-height:70px;padding:12px;font-size:18px;border-radius:14px}
  .opt .l{width:46px;height:46px;font-size:24px;border-radius:12px}
  .qtext{font-size:25px}
  .ring{width:72px;height:72px} .ring::before{width:58px;height:58px} .ring span{font-size:30px}
  .qnum{font-size:20px}
  .topic{font-size:13px}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pod{min-width:96px} .pod .blk{width:96px;font-size:34px} .pod .nm{font-size:17px;max-width:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">Desafío <span>GPD2</span></div><div class="tag">Cargando…</div></div>
  <div class="card center"><h2>Cargando…</h2></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
/* =====================================================================
   CONFIGURACIÓN — completá estos datos (ver LEEME.md)
   ===================================================================== */
const firebaseConfig = {
  databaseURL: "https://juego-gpd2-default-rtdb.firebaseio.com",
  projectId: "juego-gpd2"
};
const COMISIONES = ["comision1","comision2","comision3","comision4"];  // códigos de comisión (el docente entra con link + ?docente y uno de estos códigos)
const PTS_OK = 10;              // puntos por respuesta correcta
const PTS_BAD = -5;             // puntos por respuesta incorrecta
/* ===================================================================== */

const Q = [
 {t:"Visión y estrategia", q:"Un equipo escribe en su pizarra: \"Que cualquier productor rural pueda vender su cosecha online, sin intermediarios\". ¿Qué es esta frase?",
  o:["Un KPI operativo del equipo","Un criterio de aceptación","La visión del producto","Un objetivo táctico del trimestre"], a:2,
  e:"Describe el futuro deseado y el impacto que busca el producto. La estrategia es el camino para llegar ahí."},
 {t:"Product Vision Board", q:"¿Qué resume un Product Vision Board?",
  o:["Público objetivo, necesidades, propuesta de valor y objetivos de negocio","Tareas del Sprint, responsables y fechas de entrega","Bugs abiertos, deuda técnica y prioridades de QA","Presupuesto de marketing por canal"], a:0,
  e:"Sintetiza en una sola herramienta para quién es el producto, qué problema resuelve, qué lo hace valioso y qué busca el negocio."},

const L = ["A","B","C","D"];
const COLORS = ["#ff4f9a","#1de9d4","#ffd166","#b088ff","#4ade80","#ff8a3d","#5cc8ff","#f9a8d4"];
const OTRO = {id:"otro", name:"Otro", color:"#e4d4ff"};
const DEFAULT_NAMES = ["Equipo 1","Equipo 2","Equipo 3","Equipo 4","Equipo 5","Equipo 6","Equipo 7","Equipo 8"];
const ROOT_BASE = "gpd2/rooms/";
let ROOT = "";
const normCode = v => String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
const roomName = c => "Comisión " + String(c).replace(/\D/g,"");

/* ---------- capa de datos: Firebase o modo de prueba local ---------- */
const params = new URLSearchParams(location.search);
const MOCK = params.has("prueba");
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

async function makeFirebase(){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fdb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const app = initializeApp(firebaseConfig);
  const d = fdb.getDatabase(app);
  let offset = 0;
  fdb.onValue(fdb.ref(d, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
  return {
    listen(path, cb, onErr){ return fdb.onValue(fdb.ref(d, path), s => cb(s.val()), onErr); },
    set(path, v){ return fdb.set(fdb.ref(d, path), v); },
    async get(path){ return (await fdb.get(fdb.ref(d, path))).val(); },
    now(){ return Date.now() + offset; }
  };
}
function makeMock(){
  /* Base local compartida entre pestañas del mismo navegador, para probar sin Firebase. */
  const KEY = "gpd2-mock-db", subs = [];
  const read = () => { try { return JSON.parse(store.get(KEY) || "{}"); } catch(e){ return {}; } };
  const at = (obj, path) => path.split("/").filter(Boolean).reduce((o,k) => o == null ? undefined : o[k], obj);
  const fire = () => { const t = read(); subs.forEach(s => s.cb(at(t, s.path) ?? null)); };
  addEventListener("storage", e => { if (e.key === KEY) fire(); });
  return {
    listen(path, cb){ const s = {path, cb}; subs.push(s); setTimeout(() => cb(at(read(), path) ?? null)); return () => subs.splice(subs.indexOf(s),1); },
    async set(path, v){
      const t = read(), ks = path.split("/").filter(Boolean); let o = t;
      ks.slice(0,-1).forEach(k => { if (typeof o[k] !== "object" || o[k] === null) o[k] = {}; o = o[k]; });
      const last = ks[ks.length-1];
      if (ks.includes("answers") && o[last] != null) throw new Error("PERMISSION_DENIED");
      if (v === null) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
      store.set(KEY, JSON.stringify(t)); fire();
    },
    async get(path){ return at(read(), path) ?? null; },
    now(){ return Date.now(); }
  };
}

/* ---------- estado ---------- */
const $ = s => document.querySelector(s);
const appEl = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n > 0 ? "+" : "") + n;
let D = null, state = null, loaded = false, players = {}, gameAnswers = {};
let isHost = false, hostAuthed = false, pinErr = false;
let pid = store.get("gpd2-pid");
let room = normCode(params.get("c")); if (!COMISIONES.includes(room)) room = "";
if (MOCK && params.get("yo")) pid = "p" + params.get("yo").replace(/[^a-z0-9]/gi, "");  /* modo prueba: varios alumnos en un mismo navegador */
else if (!pid){ pid ="p" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); store.set("gpd2-pid", pid); }
let me = null, myAnswers = {}, writeErr = "", sending = false;
const DURACION = 20;  // segundos por pregunta
let setupDraft = {n:6, names:Array(8).fill(""), dur:DURACION, otro:true, nq:Q.length};
let joinDraft = {name: store.get("gpd2-name") || "", team:null};
let confirmReset = false, autoRevealFor = null, unsubGame = null, unsubMine = null, subscribedGame = null;

const teamById = id => (state?.teams||[]).find(t => t.id === id);
const playersInGame = () => Object.entries(players).filter(([,p]) => p && p.game === state?.gameId).map(([id,p]) => ({id, ...p}));
const qAnswers = qi => (gameAnswers && gameAnswers["q"+qi]) || {};

function teamPts(tid){
  let p = 0; Object.values(state.results||{}).forEach(res => { const r = res[tid]; if (r) p += (r.ok||0)*PTS_OK + (r.bad||0)*PTS_BAD; }); return p;
}
function ranking(){ return state.teams.map(t => ({...t, pts:teamPts(t.id)})).sort((a,b) => b.pts - a.pts); }
function remaining(){
  if (!state || state.status !== "question") return 0;
  return Math.max(0, Math.min(state.duration, (state.startedAt + state.duration*1000 - D.now())/1000));
}

/* ---------- arranque ---------- */
(async function init(){
  isHost = params.has("docente");
  if (isHost){ const r = sessionStorage.getItem("gpd2-host-room"); room = COMISIONES.includes(r) ? r : ""; hostAuthed = !!room; }
  if (!MOCK && String(firebaseConfig.databaseURL).includes("PEGAR")){
    return renderMsg("Falta configurar Firebase", "Abrí index.html y completá firebaseConfig con los datos de tu proyecto (ver LEEME.md). Para probar sin Firebase, agregá ?prueba al link.");
  }
  try { D = MOCK ? makeMock() : await makeFirebase(); }
  catch(e){ console.error(e); return renderMsg("No se pudo conectar", "Revisá la conexión a internet y la configuración de Firebase."); }
  setInterval(tick, 250);
  if (room) connect(); else render();
})();

/* Conectarse a la sala de una comisión: cada una tiene su propia partida, equipos y marcador. */
function connect(){
  ROOT = ROOT_BASE + room;
  loaded = false;
  renderMsg("Cargando " + roomName(room) + "…", "Conectando con el marcador en vivo.");
  const fail = setTimeout(() => { if (!loaded) renderMsg("No se pudo conectar", "Revisá la conexión a internet y recargá la página."); }, 12000);
  D.listen(ROOT + "/state", v => { clearTimeout(fail); loaded = true; state = v; onState(); render(); },
    e => { console.error(e); renderMsg("Sin permiso para leer la partida", "Revisá las reglas de la base de datos en Firebase (ver LEEME.md)."); });
  D.listen(ROOT + "/players", v => { players = v || {}; if (isHost) render(); else { me = players[pid] || null; render(); } });
  if (isHost) D.get(ROOT + "/config").then(c => {
    if (c) setupDraft = {n:c.n || setupDraft.n, dur:DURACION, nq:Q.length, otro:c.otro !== false, names:Object.assign(Array(8).fill(""), c.names || [])};
    render();
  }).catch(() => {});
}

function onState(){
  const gid = state && state.gameId;
  if (gid === subscribedGame) return;
  subscribedGame = gid;
  if (unsubGame) { unsubGame(); unsubGame = null; }
  if (unsubMine) { unsubMine(); unsubMine = null; }
  gameAnswers = {}; myAnswers = {};
  if (!gid) return;
  unsubGame = D.listen(`${ROOT}/answers/${gid}`, v => { gameAnswers = v || {}; render(); });
}
/* Respuesta propia: la que se acaba de enviar o la guardada en la base (sobrevive a recargar la página). */
function pickFor(qi){
  const k = state.gameId + ":" + qi;
  if (myAnswers[k] != null) return myAnswers[k];
  const a = qAnswers(qi)[pid];
  return a && a.o != null ? a.o : undefined;
}

function qrSvg(text){
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:8, margin:2, scalable:true}); }
  catch(e){ return ""; }
}
function renderMsg(title, body){
  appEl.innerHTML = `<div class="top"><div class="brand">Desafío <span>GPD2</span></div></div>
    <div class="card center"><h2>${esc(title)}</h2><p class="lead">${esc(body)}</p></div>`;
}
function shell(inner){
  return `<div class="top"><div class="brand">Desafío <span>GPD2</span></div><div class="tag">${isHost ? "Docente" : "Alumno"}${room ? " · " + roomName(room) : ""}${MOCK?" · prueba":""}</div></div>${inner}`;
}
function render(){
  if (isHost && !hostAuthed){ appEl.innerHTML = shell(pinView()); bind(); return; }
  if (!room){ appEl.innerHTML = shell(roomPickView()); bind(); return; }
  if (!loaded) return;
  const a = document.activeElement, focusId = a && a.id, caret = a && a.selectionStart;
  appEl.innerHTML = shell(isHost ? hostView() : playerView());
  bind();
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); if (caret != null && el.setSelectionRange) try{ el.setSelectionRange(caret, caret); }catch(e){} } }
  tick();
}
/* Contador en anillo: el número y el arco se actualizan en tick(). */
function timerBlock(){
  return `<div class="ring" id="tring" role="timer" aria-label="Segundos restantes"><span id="tnum">${Math.ceil(remaining())}</span></div>`;
}
function tick(){
  if (!state || state.status !== "question" || !D) return;
  const r = remaining(), n = $("#tnum"), ring = $("#tring");
  if (n) n.textContent = Math.ceil(r);
  if (ring){ ring.style.setProperty("--p", (r / state.duration).toFixed(3)); ring.classList.toggle("low", r <= 5); }
  if (isHost && hostAuthed && r <= 0 && autoRevealFor !== state.gameId + state.q){ autoRevealFor = state.gameId + state.q; reveal(); }
  if (!isHost && r <= 0) document.querySelectorAll("button.opt").forEach(x => x.disabled = true);
}
const rulesHTML = `<div class="rules"><span class="p">Correcta ${fmt(PTS_OK)}</span><span class="n">Incorrecta ${PTS_BAD}</span><span class="z">Sin responder 0</span></div>`;
const qHead = (qi, total, qq) => `<div class="qhead"><div class="qhead-l"><span class="qnum">Pregunta ${qi+1} <small>de ${total}</small></span><span class="topic">${esc(qq.t)}</span></div>`;

/* Marcador: nombre legible siempre (fuera de la barra) y barra proporcional a los puntos. */
function boardHTML(qi){
  const r = ranking(), max = Math.max(PTS_OK, ...r.map(t => t.pts));
  const res = qi != null ? (state.results||{})["q"+qi] || {} : null;
  return `<div class="board">${r.map((t,i) => {
    const rr = res && res[t.id], d = rr ? (rr.ok||0)*PTS_OK + (rr.bad||0)*PTS_BAD : null;
    const w = t.pts > 0 ? Math.max(3, t.pts / max * 100) : 0;
    return `<div class="brow ${i===0 && t.pts>0 ? "first" : ""}"><span class="pos">${i+1}</span>
      <div class="bname"><b><span class="swatch" style="background:${t.color}"></span>${esc(t.name)}</b>${rr && (rr.ok||rr.bad) ? `<small>${rr.ok||0} ✓ · ${rr.bad||0} ✗ en esta pregunta</small>` : ""}</div>
      <div class="btrack"><i style="width:${w}%;background:${t.color}"></i></div>
      <div class="pts">${d ? `<span class="delta ${d>0?"p":"n"}">${fmt(d)}</span>` : ""}${t.pts}</div></div>`; }).join("")}</div>`;
}

/* ----- docente ----- */
function pinView(){
  return `<div class="card"><h2>Entrar como docente</h2>
    <label for="pin">Código de la comisión<input id="pin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="row"><button class="btn primary" id="pinok">Entrar</button>${pinErr ? `<span class="err">Código incorrecto. Usá comision1, comision2, comision3 o comision4.</span>` : ""}</div></div>`;
}
function roomPickView(){
  return `<div class="card"><h2>¿De qué comisión sos?</h2>
    <div class="teampicks">${COMISIONES.map((c,i) => `<button class="teampick" type="button" data-room="${c}" style="background:${COLORS[i]}">${roomName(c)}</button>`).join("")}</div></div>`;
}
function hostView(){
  if (!state || state.status === "setup") return setupView();
  const qi = state.q, qq = Q[state.order[qi]] || Q[0], total = state.order.length, ps = playersInGame();
  const joinUrl = location.origin + location.pathname.replace(/index\.html$/, "") + "?c=" + room + (MOCK ? "&prueba" : "");
  const resetBtn = `<button class="btn small warn" id="reset">${confirmReset ? "Tocá de nuevo para confirmar" : "Nueva partida"}</button>`;
  if (state.status === "lobby"){
    return `<div class="card">
      <div class="spread"><h1>Sala de espera</h1>${resetBtn}</div>
      <div class="lobby"><div class="qr" aria-label="Código QR para entrar al juego">${qrSvg(joinUrl)}</div>
        <div class="joininfo"><h2>Sumate desde el celular</h2>
          <ol class="steps"><li>Escaneá el QR con la cámara o entrá a:</li></ol>
          <div class="joinurl">${esc(joinUrl.replace(/^https?:\/\//,""))}</div>
          <ol class="steps" start="2"><li>Escribí tu nombre y elegí tu equipo.</li><li>Respondé cada pregunta antes de que termine el tiempo (${state.duration} s).</li></ol>
          ${rulesHTML}</div></div></div>
    <div class="card">
      <div class="spread"><h3>${ps.length} ${ps.length===1?"alumno conectado":"alumnos conectados"}</h3><button class="btn primary big" id="start">Empezar el juego</button></div>
      <div class="teams">${state.teams.map(t => { const m = ps.filter(p => p.team === t.id);
        return `<div class="team ${m.length?"":"empty"}" style="--c:${t.color}"><span class="name">${esc(t.name)}</span><span class="big2">${m.length}</span>
        <span class="st">${m.length ? esc(m.map(p => p.name).slice(0,6).join(", ")) + (m.length>6?"…":"") : "Nadie todavía"}</span></div>`; }).join("")}</div></div>`;
  }
  if (state.status === "question"){
    const ans = qAnswers(qi), n = Object.keys(ans).length, pct = ps.length ? n / ps.length * 100 : 0;
    return `<div class="card">
      ${qHead(qi, total, qq)}${timerBlock()}</div>
      <div class="qtext">${esc(qq.q)}</div>
      <div class="opts">${qq.o.map((o,j) => `<div class="opt"><span class="l">${L[j]}</span><span>${esc(o)}</span><span></span></div>`).join("")}</div>
    </div>
    <div class="card">
      <div class="spread"><div class="progress"><span class="lbl">Respondieron <b>${n}</b> de ${ps.length}</span><div class="meter"><i style="width:${pct}%"></i></div></div>
        <button class="btn primary big" id="reveal">Revelar respuesta</button></div>
      <div class="teams">${state.teams.map(t => { const m = ps.filter(p => p.team === t.id), d = m.filter(p => ans[p.id]).length;
        return `<div class="team ${m.length?"":"empty"}" style="--c:${t.color}"><span class="name">${esc(t.name)}</span>
          ${m.length ? `<span class="big2">${d}<small> / ${m.length}</small></span><div class="meter"><i style="width:${d/m.length*100}%"></i></div>` : `<span class="st">Sin integrantes</span>`}</div>`; }).join("")}</div>
    </div>`;
  }
  if (state.status === "reveal"){
    const isLast = qi >= total - 1, counts = (state.counts && state.counts["q"+qi]) || [0,0,0,0];
    return `<div class="card">
      ${qHead(qi, total, qq)}</div>
      <div class="qtext">${esc(qq.q)}</div>
      <div class="opts">${qq.o.map((o,j) => `<div class="opt ${j===qq.a?"right":(counts[j]?"wrong":"dim")}"><span class="l">${L[j]}</span><span>${esc(o)}</span><span class="cnt">${counts[j]||0} ${counts[j]===1?"voto":"votos"}</span></div>`).join("")}</div>
      ${qq.e ? `<p class="expl">${esc(qq.e)}</p>` : ""}
    </div>
    <div class="card"><div class="spread"><h2>Puntos por equipo</h2><button class="btn primary big" id="next">${isLast ? "Ver ranking final" : "Siguiente pregunta"}</button></div>${boardHTML(qi)}</div>`;
  }
  if (state.status === "final"){
    const r = ranking(), top = r.slice(0,3), h = [170,125,90], order = [1,0,2].filter(i => top[i]);
    const okBy = {};
    Object.entries(gameAnswers||{}).forEach(([qk, byP]) => { const qq2 = Q[state.order[+qk.slice(1)]];
      Object.entries(byP||{}).forEach(([p, a]) => { if (a && a.o === qq2.a) okBy[p] = (okBy[p]||0) + 1; }); });
    const stars = ps.map(p => ({...p, ok:okBy[p.id]||0, t:teamById(p.team)})).filter(s => s.t).sort((a,b) => b.ok - a.ok).slice(0,6);
    return `<div class="card center"><span class="tag">Fin del juego</span><h1>¡Ganó ${esc(r[0].name)}!</h1>
      <div class="podium">${order.map(i => `<div class="pod"><span class="nm">${esc(top[i].name)}</span><span class="pp">${top[i].pts} pts</span>
        <div class="blk" style="background:${top[i].color};height:${h[i]}px">${i+1}</div></div>`).join("")}</div></div>
      <div class="card"><div class="spread"><h2>Ranking de equipos</h2>${resetBtn}</div>${boardHTML(null)}</div>
      ${stars.length ? `<div class="card"><h3>Más respuestas correctas</h3><div class="stars">${stars.map(s => `<div class="star" style="--c:${s.t.color}"><b>${esc(s.name)}</b><span>${s.ok} de ${total}</span></div>`).join("")}</div></div>` : ""}`;
  }
  return setupView();
}
function setupView(){
  const d = setupDraft;
  return `<div class="card">
    <div class="spread"><h1>Armá la partida</h1><button class="btn small" id="switchroom">Cambiar de comisión</button></div>
    <p class="lead">${roomName(room)} · ${Q.length} preguntas de ${DURACION} segundos. Cada alumno responde desde su celular y su respuesta suma o resta puntos a su equipo.</p>
    ${rulesHTML}
    <div class="grid-setup">
      <label for="nTeams">Cantidad de equipos<select id="nTeams">${[2,3,4,5,6,7,8].map(n => `<option value="${n}" ${n===d.n?"selected":""}>${n} equipos</option>`).join("")}</select></label>
    </div>
    <h3>Nombres de los equipos</h3>
    <div class="grid-setup">${Array.from({length:d.n}, (_,i) => `<div class="teamrow"><span class="swatch" style="background:${COLORS[i]}"></span>
      <input id="tn${i}" data-tn="${i}" value="${esc(d.names[i])}" placeholder="Nombre del equipo ${i+1}" maxlength="28" aria-label="Nombre del equipo ${i+1}"></div>`).join("")}</div>
    <label class="check" for="otro"><input type="checkbox" id="otro" ${d.otro?"checked":""}> Agregar la opción "Otro" para quien no tiene equipo (compite como un equipo más)</label>
    <div class="row end">${writeErr ? `<span class="err">${esc(writeErr)}</span>` : ""}<button class="btn primary big" id="create">Abrir sala de espera</button></div>
  </div>`;
}

/* ----- alumno ----- */
function playerView(){
  if (!state || state.status === "setup") return `<div class="card center"><h2>Todavía no hay partida</h2><p class="lead">Esperá a que el docente abra la sala. Esta pantalla se actualiza sola.</p></div>`;
  const joined = me && me.game === state.gameId ? teamById(me.team) : null;
  const err = writeErr ? `<p class="err">${esc(writeErr)}</p>` : "";
  if (!joined){
    if (state.status === "final") return `<div class="card center"><h2>La partida terminó</h2><p class="lead">Esperá a que el docente abra una nueva.</p></div>`;
    const ready = joinDraft.name.trim().length >= 2 && joinDraft.team;
    return `<div class="card"><h2>Sumate al juego</h2>
      <label for="pname">Tu nombre y apellido<input id="pname" maxlength="40" autocomplete="name" value="${esc(joinDraft.name)}" placeholder="Ej.: Sofía Pérez"></label>
      <h3>Elegí tu equipo</h3>
      <div class="teampicks">${state.teams.map(t => `<button class="teampick ${joinDraft.team===t.id?"on":""}" type="button" data-team="${t.id}" style="background:${t.color}" aria-pressed="${joinDraft.team===t.id}">${esc(t.name)}</button>`).join("")}</div>
      <button class="btn primary big" id="join" ${ready && !sending?"":"disabled"}>Entrar</button>
      ${state.status !== "lobby" ? `<p class="note">El juego ya empezó: vas a poder responder desde la pregunta actual.</p>` : ""}${err}</div>`;
  }
  const rk = ranking(), mine = rk.find(t => t.id === joined.id), pos = rk.indexOf(mine) + 1;
  const bar = `<div class="me" style="--c:${joined.color}"><span class="swatch" style="background:${joined.color}"></span>
    <div class="who"><b>${esc(joined.name)}</b><span>${esc(me.name)}</span></div>
    <div class="score"><b>${mine.pts}</b><span>pts · ${pos}º</span></div></div>`;
  const qi = state.q, qq = Q[state.order[qi]] || Q[0], total = state.order.length, myPick = pickFor(qi);
  if (state.status === "lobby"){
    return `${bar}<div class="card center"><h2>¡Listo, ${esc(me.name.split(" ")[0])}!</h2><p class="lead">Esperá a que el docente largue la primera pregunta.</p>
      ${rulesHTML}<button class="btn small" id="leave">Cambiar nombre o equipo</button>${err}</div>`;
  }
  if (state.status === "question"){
    const closed = remaining() <= 0 || myPick != null || sending;
    return `${bar}<div class="card">
      ${qHead(qi, total, qq)}${timerBlock()}</div>
      <div class="qtext">${esc(qq.q)}</div>
      <div class="opts">${qq.o.map((o,j) => `<button type="button" class="opt ${myPick===j?"sel":""}" data-pick="${j}" ${closed?"disabled":""}><span class="l">${L[j]}</span><span>${esc(o)}</span><span></span></button>`).join("")}</div>
      ${myPick!=null ? `<p class="sent">Enviaste la ${L[myPick]} · esperá el resultado</p>` : `<p class="note">Una sola respuesta: si te equivocás, tu equipo pierde ${-PTS_BAD} puntos; si no respondés, no suma ni resta.</p>`}${err}</div>`;
  }
  if (state.status === "reveal"){
    const ok = myPick === qq.a, rr = ((state.results||{})["q"+qi]||{})[joined.id], d = rr ? (rr.ok||0)*PTS_OK + (rr.bad||0)*PTS_BAD : 0;
    const rc = myPick==null ? "var(--muted)" : ok ? "var(--teal)" : "var(--bad)";
    return `${bar}<div class="card center" style="--rc:${rc}">
      <div class="result">${myPick==null ? "–" : ok ? "✓" : "✗"}</div>
      <h2>${myPick == null ? "No respondiste a tiempo" : ok ? "¡Correcto!" : "Incorrecto"}</h2>
      <span class="chip">${myPick==null ? "0 pts" : ok ? fmt(PTS_OK) + " pts" : PTS_BAD + " pts"}</span>
      <div class="answer"><span class="l">${L[qq.a]}</span><span>${esc(qq.o[qq.a])}</span></div>
      ${qq.e ? `<p class="muted">${esc(qq.e)}</p>` : ""}
      ${rr ? `<div class="teamline"><span>Tu equipo</span><span style="color:var(--teal)">${rr.ok||0} ✓</span><span style="color:var(--bad)">${rr.bad||0} ✗</span><span style="color:var(--gold)">${fmt(d)} pts</span></div>` : ""}</div>`;
  }
  if (state.status === "final"){
    const myOk = state.order.filter((qIdx, i) => pickFor(i) === Q[qIdx].a).length;
    return `${bar}<div class="card center"><span class="tag">Fin del juego</span>
      <h1 class="big">${pos}º</h1><h2>${pos===1 ? "¡Tu equipo ganó!" : "Tu equipo terminó en el puesto " + pos}</h2>
      <p class="lead">Acertaste ${myOk} de ${total} preguntas.</p></div>
      <div class="card"><h3>Ranking de equipos</h3>${boardHTML(null)}</div>`;
  }
  return "";
}

/* ---------- acciones ---------- */
function bind(){
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
  on("pinok", () => { const c = normCode($("#pin").value);
    if (COMISIONES.includes(c)){ room = c; hostAuthed = true; pinErr = false; try { sessionStorage.setItem("gpd2-host-room", c); } catch(e){} connect(); }
    else { pinErr = true; render(); } });
  on("switchroom", () => { try { sessionStorage.removeItem("gpd2-host-room"); } catch(e){} location.href = location.pathname + "?docente" + (MOCK ? "&prueba" : ""); });
  document.querySelectorAll("[data-room]").forEach(b => b.addEventListener("click", () => {
    room = b.dataset.room;
    try { history.replaceState(null, "", location.pathname + "?c=" + room + (MOCK ? "&prueba" : "") + (params.get("yo") ? "&yo=" + params.get("yo") : "")); } catch(e){}
    connect();
  }));
  const pin = $("#pin"); if (pin) pin.addEventListener("keydown", e => { if (e.key === "Enter") $("#pinok").click(); });
  const n = $("#nTeams"); if (n) n.addEventListener("change", e => { setupDraft.n = +e.target.value; render(); });
  const du = $("#dur"); if (du) du.addEventListener("change", e => { setupDraft.dur = +e.target.value; });
  const nqs = $("#nq"); if (nqs) nqs.addEventListener("change", e => { setupDraft.nq = +e.target.value; });
  const ot = $("#otro"); if (ot) ot.addEventListener("change", e => { setupDraft.otro = e.target.checked; });
  document.querySelectorAll("[data-tn]").forEach(inp => inp.addEventListener("input", e => { setupDraft.names[+e.target.dataset.tn] = e.target.value; }));
  on("create", createGame);
  on("start", () => writeState({...state, status:"question", q:0, qk:"q0", startedAt:D.now()}));
  on("reveal", reveal);
  on("next", () => {
    const last = state.q >= state.order.length - 1;
    writeState(last ? {...state, status:"final", qk:""} : {...state, status:"question", q:state.q+1, qk:"q"+(state.q+1), startedAt:D.now()});
  });
  on("reset", () => {
    if (!confirmReset){ confirmReset = true; render(); setTimeout(() => { confirmReset = false; render(); }, 4000); return; }
    confirmReset = false; writeState({...state, status:"setup", qk:""});
  });
  const pn = $("#pname"); if (pn) pn.addEventListener("input", e => {
    joinDraft.name = e.target.value; const j = $("#join"); if (j) j.disabled = !(joinDraft.name.trim().length >= 2 && joinDraft.team);
  });
  document.querySelectorAll("[data-team]").forEach(b => b.addEventListener("click", () => { joinDraft.team = b.dataset.team; render(); }));
  on("join", async () => {
    const name = joinDraft.name.trim().slice(0,40);
    if (name.length < 2 || !joinDraft.team) return;
    store.set("gpd2-name", name);
    const doc = {name, team:joinDraft.team, game:state.gameId};
    sending = true; writeErr = ""; render();
    try { await D.set(`${ROOT}/players/${pid}`, doc); me = doc; }
    catch(e){ console.error(e); writeErr = "No se pudo entrar. Revisá la conexión y probá de nuevo."; }
    sending = false; render();
  });
  on("leave", async () => { joinDraft.team = me.team; try { await D.set(`${ROOT}/players/${pid}`, {...me, game:""}); } catch(e){} });
  document.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", async () => {
    const qi = state.q, k = state.gameId + ":" + qi;
    if (remaining() <= 0 || state.status !== "question" || pickFor(qi) != null || sending) return;
    const o = +b.dataset.pick;
    myAnswers[k] = o; sending = true; writeErr = ""; render();
    try { await D.set(`${ROOT}/answers/${state.gameId}/q${qi}/${pid}`, {o, team:me.team, at:D.now()}); }
    catch(e){
      console.error(e);
      const saved = await D.get(`${ROOT}/answers/${state.gameId}/q${qi}/${pid}`).catch(() => null);
      if (saved && saved.o != null) myAnswers[k] = saved.o;
      else { delete myAnswers[k]; writeErr = state.status === "question" ? "No se pudo enviar. Probá de nuevo." : "Se terminó el tiempo para esta pregunta."; }
    }
    sending = false; render();
  }));
}

async function writeState(next){
  writeErr = ""; state = next; render();
  try { await D.set(ROOT + "/state", next); }
  catch(e){ console.error(e); writeErr = "No se pudo guardar el cambio. Revisá la conexión."; render(); }
}
function createGame(){
  /* Preguntas con posición fija (fixed = índice en la partida); el resto, al azar. */
  const fixed = Q.map((q,i) => ({i, pos:q.fixed})).filter(x => x.pos != null);
  const rest = Q.map((_,i) => i).filter(i => Q[i].fixed == null);
  for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [rest[i],rest[j]] = [rest[j],rest[i]]; }
  rest.length = Math.max(0, Math.min(setupDraft.nq || Q.length, Q.length) - fixed.length);
  const order = rest.slice();
  fixed.sort((a,b) => a.pos - b.pos).forEach(f => order.splice(Math.min(f.pos, order.length), 0, f.i));
  const teams = Array.from({length:setupDraft.n}, (_,i) => ({id:"t"+(i+1), name:(setupDraft.names[i]||"").trim() || DEFAULT_NAMES[i], color:COLORS[i]}));
  if (setupDraft.otro) teams.push({...OTRO});
  D.set(ROOT + "/config", {n:setupDraft.n, dur:setupDraft.dur, nq:setupDraft.nq, otro:setupDraft.otro, names:setupDraft.names.slice(0, setupDraft.n).map(x => (x||"").trim())}).catch(e => console.error(e));
  writeState({gameId:"g"+Date.now().toString(36), status:"lobby", q:0, qk:"", startedAt:0, duration:setupDraft.dur, teams, order, results:{}, counts:{}});
}
async function reveal(){
  if (!state || state.status !== "question") return;
  const qi = state.q, qq = Q[state.order[qi]], gid = state.gameId;
  /* Cerrar la pregunta primero (las reglas rechazan respuestas nuevas) y después contar. */
  const closing = {...state, status:"reveal", qk:""};
  state = closing; render();
  try { await D.set(ROOT + "/state", closing); } catch(e){ console.error(e); }
  const ans = (await D.get(`${ROOT}/answers/${gid}/q${qi}`).catch(() => null)) || qAnswers(qi);
  const res = {}, counts = qq.o.map(() => 0);
  state.teams.forEach(t => { res[t.id] = {ok:0, bad:0}; });
  Object.values(ans).forEach(a => {
    if (!a || a.o == null || !res[a.team]) return;
    counts[a.o]++;
    if (a.o === qq.a) res[a.team].ok++; else res[a.team].bad++;
  });
  await writeState({...state, results:{...(state.results||{}), ["q"+qi]:res}, counts:{...(state.counts||{}), ["q"+qi]:counts}});
}
</script>
